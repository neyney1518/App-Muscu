<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Application de suivi de musculation">
    <title>Mes séances</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div id="seances-list-view" class="view active">
        <header class="main-header">
            <div class="header-title-group">
                <img src="icon-192.png" alt="Logo" class="header-logo">
                <h1 class="main-title">Mes séances</h1>
            </div>
            <div class="header-actions">
                <button id="settings-btn" class="header-icon-btn">⚙️</button>
                <button id="add-seance-header-btn" class="header-add-btn">+</button>
            </div>
        </header>

        <div class="seances-grid" id="seances-grid"></div>
        <div id="empty-seances" class="empty-message hidden">
            <p>Aucune séance créée</p>
            <p class="empty-subtitle">Appuyez sur + pour commencer</p>
        </div>
    </div>

    <div id="seance-detail-view" class="view">
        <header class="detail-header">
            <button id="back-to-list" class="back-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
            <h2 id="seance-title" class="detail-title">Séance</h2>
            <button id="start-timer-btn" class="timer-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
            <button class="options-btn">⋮</button>
        </header>

        <div class="exercise-carousel">
            <div id="exercise-carousel-items" class="carousel-items"></div>
            <button id="add-exercise-carousel-btn" class="carousel-add-btn">+</button>
        </div>

        <div id="exercise-detail-content" class="exercise-detail">
            <div class="comment-section">
                <div class="section-header-inline"><label class="section-label-inline">COMMENTAIRE</label></div>
                <textarea id="exercise-comment-detail" class="comment-textarea" placeholder="Réglages, sensations..."></textarea>
            </div>

            <div class="session-section">
                <div class="section-header-with-badge">
                    <label class="section-label-inline">SÉRIE EN COURS</label>
                    <span id="pr-badge" class="pr-badge hidden">🏆 Record !</span>
                </div>
                <div class="series-table-container">
                    <table class="series-table-modern">
                        <thead><tr><th>☐</th><th>#</th><th>reps</th><th>kg</th><th>repos</th><th>RIR</th><th>fait</th></tr></thead>
                        <tbody id="series-tbody-detail"></tbody>
                    </table>
                </div>
                <div class="action-buttons">
                    <button class="btn-action btn-delete-series">Supprimer</button>
                    <button id="add-series-detail-btn" class="btn-action btn-add-series">Ajouter une série</button>
                </div>
            </div>

            <div class="history-section">
                <label class="section-label-inline">HISTORIQUE RÉCENT</label>
                <div id="history-timeline" class="history-timeline"></div>
            </div>
        </div>
        
        <div class="finish-session-container">
            <button id="finish-session-btn" class="finish-btn">Terminer la séance</button>
        </div>
    </div>

    <div id="historique-view" class="view">
        <header class="main-header"><h1 class="main-title">Suivi</h1></header>
        <div class="content-container">
            <div class="stats-section">
                <div class="stat-card-modern"><span class="stat-value-modern" id="total-sessions">0</span><span class="stat-label-modern">Séances terminées</span></div>
            </div>
            <div class="calendar-section">
                <h3 class="section-title-small">Calendrier</h3>
                <div class="calendar-header">
                    <button id="prev-month" class="calendar-nav-btn">‹</button>
                    <span id="current-month" class="calendar-month-label"></span>
                    <button id="next-month" class="calendar-nav-btn">›</button>
                </div>
                <div id="calendar" class="calendar-modern"></div>
            </div>
            <div class="performance-section">
                <h3 class="section-title-small">Progression</h3>
                <div class="chart-controls">
                    <select id="chart-exercise-select" class="chart-select"><option value="" disabled selected>Choisir...</option></select>
                    <div class="chart-toggles">
                        <button class="chart-toggle active" data-metric="weight">Poids Max</button>
                        <button class="chart-toggle" data-metric="volume">Volume</button>
                    </div>
                </div>
                <div class="chart-container"><div id="performance-chart" class="performance-chart"></div></div>
                <div id="chart-stats-summary" class="chart-stats-summary hidden">
                    <div class="mini-stat"><span class="mini-stat-label">Max</span><span class="mini-stat-value" id="stat-max-val">-</span></div>
                    <div class="mini-stat"><span class="mini-stat-label">Dernier</span><span class="mini-stat-value" id="stat-last-val">-</span></div>
                    <div class="mini-stat"><span class="mini-stat-label">Prog.</span><span class="mini-stat-value" id="stat-progression">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn-modern active" data-view="seances-list">
            <svg class="nav-icon-modern" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span class="nav-label-modern">Séances</span>
        </button>
        <button class="nav-btn-modern" data-view="calendar">
            <svg class="nav-icon-modern" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>
            <span class="nav-label-modern">Historique</span>
        </button>
    </nav>

    <div id="seance-modal" class="modal-overlay">
        <div class="modal-modern">
            <h3 class="modal-title">Nouvelle séance</h3>
            <input type="text" id="new-seance-name" class="input-modern" placeholder="Nom (ex: Push)">
            <div class="modal-actions-modern"><button id="cancel-seance-btn" class="btn-modal-secondary">Annuler</button><button id="save-seance-btn" class="btn-modal-primary">Créer</button></div>
        </div>
    </div>

    <div id="exercise-modal" class="modal-overlay">
        <div class="modal-modern">
            <h3 class="modal-title">Ajouter un exercice</h3>
            <input type="text" id="new-exercise-name" class="input-modern" placeholder="Nom (ex: Dips)" list="exercises-list">
            <datalist id="exercises-list"></datalist>
            <input type="text" id="new-exercise-muscle" class="input-modern" placeholder="Groupe (ex: Pectoraux)">
            <div class="modal-actions-modern"><button id="cancel-exercise-btn" class="btn-modal-secondary">Annuler</button><button id="save-exercise-btn" class="btn-modal-primary">Créer</button></div>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-modern">
            <h3 class="modal-title">Paramètres</h3>
            <p style="color: #888; margin-bottom: 20px; font-size: 14px;">Gérez vos données.</p>
            <button id="export-data-btn" class="btn-modal-secondary" style="width: 100%; margin-bottom: 12px; display:flex; align-items:center; justify-content:center; gap:8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Sauvegarder
            </button>
            <button id="import-data-btn" class="btn-modal-secondary" style="width: 100%; margin-bottom: 20px; display:flex; align-items:center; justify-content:center; gap:8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Restaurer
            </button>
            <input type="file" id="import-file-input" accept=".json" style="display: none;">
            <button id="close-settings-btn" class="btn-modal-primary">Fermer</button>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="app.js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');</script>
</body>
</html>
